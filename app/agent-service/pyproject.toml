[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ask-workbench"
version = "0.1.0"
description = "FastAPI + Antigravity SDK backend for AskAsk* UAT & Agent Maintainer Workbench"
requires-python = ">=3.11"
dependencies = [
  "ag-workbench",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "google-antigravity>=0.1.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
ag-workbench = { path = "../vendor/antigravity-workbench/backend", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ask_workbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
